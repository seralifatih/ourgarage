name: Supabase Keepalive

# Free-tier Supabase projects pause after a week without activity, which takes
# household sharing down for everyone (it happened in November 2026). A real
# database query every two days keeps the project awake. Same approach as the
# JudgeMe keepalive.
#
# The query reads `households` with the anon key. RLS gives anon no rows, so
# the response is `[]` — but Postgres still runs the query, which is what
# counts as activity. A 200 is required; anything else fails the run, so a
# paused or broken project shows up as a red workflow (and a GitHub email).

on:
  schedule:
    # 06:00 UTC on every second day of the month (1st, 3rd, …). The 31st and
    # the 1st both fire, so the longest gap is still two days.
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set."
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/households?select=id&limit=1")

          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keepalive failed with HTTP $status (paused or unreachable?)"
            exit 1
          fi
